//Landing: the gear's brakes, suspension and tyres.

//Doubles the gear's brake torque, so the orbiter brakes firmly while the brake slider stays below 100 %, where KSP switches to a parking brake that locks the wheels.
@PART[benjee10_shuttle_mainGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelBrakes]
	{
		@maxBrakeTorque = 14
	}
}
@PART[benjee10_shuttle_noseGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelBrakes]
	{
		@maxBrakeTorque = 8
	}
}

//Gives the main and nose gear a realistic suspension, so the orbiter doesn't bottom out, bounce or ride high after landing; the nose gear's shorter travel keeps its wheel against the strut. Existing craft need the gear at Spring Strength 1, Damper Strength 2 and Auto Spring/Damper off.
@PART[benjee10_shuttle_mainGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelSuspension]
	{
		@suspensionDistance = 0.22
		@springRatio = 41
		@damperRatio = 8
		%springTweakable = 1
		%damperTweakable = 2
		%autoSpringDamper = False
		%useAutoBoost = False
	}
}
@PART[benjee10_shuttle_noseGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelSuspension]
	{
		@suspensionDistance = 0.12
		@springRatio = 15.3
		@damperRatio = 6
		%springTweakable = 1
		%damperTweakable = 2
		%autoSpringDamper = False
		%useAutoBoost = False
	}
}

//Gives the main and nose gear tyres realistic grip, so the orbiter doesn't rock from wheel to wheel on the runway and the brakes don't lock up. Keep Auto Friction on.
@PART[benjee10_shuttle_mainGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelBase]
	{
		%frictionAdherent = 0.06
		%frictionPeak = 0.35
		%frictionLimit = 0.275
	}
}
@PART[benjee10_shuttle_noseGear]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@MODULE[ModuleWheelBase]
	{
		%frictionAdherent = 0.06
		%frictionPeak = 0.35
		%frictionLimit = 0.275
	}
}
