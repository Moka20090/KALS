//Without FAR: SockPitchFix adds the stock orbiter's hypersonic nose-up correction in entry. With FAR this patch does nothing.
//The switch is this module's pitchFix (true = on, false = off) and scale (the share of the table, 0 to 2); read at each entry's start.
@PART[benjee10_shuttle_midFuselage]:NEEDS[Benjee10_shuttleOrbiter&!FerramAerospaceResearch]
{
	MODULE
	{
		name = SockPitchFix
		//The Mach knots, and the nose-up correction per unit dynamic pressure on them (m^3 = kN m per kPa)
		mach = 2.5, 3, 3.75, 5.25, 7, 8
		dmq = 0, 3, 5, 12, 25, 34
		//deg: the alpha each knot was fitted at; fAlpha / fValue scale the torque with alpha
		alphaRef = 26, 26, 26, 35, 40, 40
		fAlpha = 35, 40
		fValue = 0.58, 0.91
		//The switch (true = the correction acts, false = off), and the share of the table flown (1.0 = all)
		pitchFix = true
		scale = 1.0
		//kPa: an entry starts at qMin and ends below qEnd
		qMin = 0.05
		qEnd = 0.01
		//s between the KSP.log lines while the torque acts
		logEvery = 5
	}
}
