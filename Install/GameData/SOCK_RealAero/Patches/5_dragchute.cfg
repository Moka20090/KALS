//Drag chute: SPOCK's drag chute. Only used with SPOCK; delete this file if you don't have it.

//Gives the drag chute the real orbiter's stopping power for the orbiter's mass, and keeps its deployed drag shape when the part switches style.
@PART[pathfinder_shuttle_Dragchute]:NEEDS[ShuttleStuff_SharedAssets]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[chuteBase]]
	{
		%affectDragCubes = false
	}
	@MODULE[ModuleDragModifier]:HAS[#dragCubeName[SEMIDEPLOYED]]
	{
		@dragModifier = 0.45
	}
	@MODULE[ModuleDragModifier]:HAS[#dragCubeName[DEPLOYED]]
	{
		@dragModifier = 0.94
	}
}
