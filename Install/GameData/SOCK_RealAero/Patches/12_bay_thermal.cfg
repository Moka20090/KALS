//Raises the docking ODS's temperature limits so it doesn't overheat and explode in entry (the same in stock and FAR).
@PART[benjee10_shuttle_ODS]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	%maxTemp = 1500
	%skinMaxTemp = 3200
}

//Gives the APAS port's skin the same margin.
@PART[B10_APASv2]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	%skinMaxTemp = 3200
}

//Gives the Ku-band antenna's skin the same margin.
@PART[benjee10_shuttle_kuBand]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	%skinMaxTemp = 3200
}
