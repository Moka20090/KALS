//FAR only (does nothing without FAR): SockFarTrim makes FAR's orbiter fly like the stock one, with the tables in far_trim.cfg. Needs neither kOS nor KAL/S.
@PART[benjee10_shuttle_midFuselage]:NEEDS[Benjee10_shuttleOrbiter&FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	MODULE
	{
		name = SockFarTrim
		//Evens out the gear-down drag between FAR and stock.
		//gearDragS: m^2 of drag taken back when positive, added when negative.
		gearDragS = -0.55
		//deg of alpha from which the gear-down lift correction acts (0.4 m^2 of lift per deg past it)
		gearLiftA0 = 5.0
	}
}
