//Heat shielding: the TPS thermal properties of the wing, elevons, body flap and fuselage.

//Gives the wing, elevons and body flap the fuselage's thermal properties, so they don't overheat during entry in Quarter or Real scale.
@PART[benjee10_shuttle_deltaWing|benjee10_shuttle_elevon1|benjee10_shuttle_elevon2|benjee10_shuttle_bodyFlap]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	%thermalMassModifier = 8.0
	%heatConductivity = 0.06
	%emissiveConstant = 0.95
	%skinInternalConductionMult = 0.05
	%skinMaxTemp = 3200
}

//Changes the thermal properties of the shuttle fuselage parts to be more realistic for a TPS-covered fuselage.
@PART[benjee10_shuttle_forwardFuselage|benjee10_shuttle_midFuselage|benjee10_shuttle_aftFuselage]:FINAL
{
    %thermalMassModifier = 8.0
    %heatConductivity = 0.06
    %emissiveConstant = 0.95
    %skinInternalConductionMult = 0.05
    %skinMaxTemp = 3200
}
