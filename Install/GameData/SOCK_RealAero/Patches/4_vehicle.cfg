//The vehicle: the centre-of-gravity ballast.

//Moves 0.6 t from the forward to the aft fuselage, so the orbiter enters with its CoM on the trim point.
@PART[benjee10_shuttle_forwardFuselage]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@mass -= 0.6
}
@PART[benjee10_shuttle_aftFuselage]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@mass += 0.6
}
