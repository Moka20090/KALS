//Firefly: one continuous Firefly envelope for the orbiter. Optional: does nothing without Firefly. Set enabled = false to leave Firefly as it ships.
SOCK_FIREFLY
{
	enabled = true
	//true logs each envelope mesh to KSP.log
	verbose = false
	//The part that carries the merged envelope, and the parts merged into it
	prefix = benjee10.shuttle.
	anchor = midFuselage
	//The gear joins the hull (its doors close the belly and the nose)
	hull = forwardFuselage, midFuselage, aftFuselage, deltaWing, mainGear, noseGear
	//Hull parts that give only the meshes under a transform whose name contains the text (part:text), here the gear doors
	only = mainGear:door, noseGear:door
	//true drops hull triangles inside another orbiter part's collider; false lets the cull do it per small triangle
	trim = false
	//metres: drops an envelope triangle when a ray out along its normal meets the orbiter within this (hidden areas); 0 = off
	cull = 6
	//true writes the envelope meshes to Plugins/PluginData for a look offline
	dump = false
	//true leaves out faces that have a coincident opposed twin in another mesh (they would shade a dark band across the belly)
	twins = true
	//metres: a strip along each open edge so the hull and the moving pieces meet without dark lines; 0 = off
	seam = 0.08
	//degrees: at a sharper edge each face keeps its own shading normal; 0 = off
	crease = 60
	//Meshes left out of every envelope when their transform's name contains one of these (hinge mechanisms, wing detail strips, decals)
	skip = baydoorInner, deltaWingGreeble, nameplate, Decal, Flag
	//metres: the longest edge of the envelope mesh; 0 = as the parts' meshes
	max_edge = 0.7
	//Parts whose control surfaces get an envelope of their own that deflects with them
	moving = elevon1, elevon2, bodyFlap, rudder
	//Orbiter parts that give no envelope of their own
	none = payloadTruss, longeron, kuBand, ODS
	//metres the merged skin is pushed out, so Firefly's airstream test doesn't drop patches of the shell
	inflate = 0.15
	//metres: a moving piece's triangle is left out when the hull's envelope lies within this, so no shell lights twice; 0 = off
	cover = 0.3
	//metres: also left out when the hull's envelope lies within this on both sides along one body axis
	sandwich = 1
	//metres: the push-out normal is the mean of the skin's normals within this, so it doesn't fold into pleats; 0 = off
	smooth = 0.06
	//true ends each hull seam strip where it reaches a piece's envelope
	seam_fit = true
	//metres across: caps hull skin holes up to this size (the forward RCS ports) so the shell runs over them; 0 = off
	caps = 0.45
}
