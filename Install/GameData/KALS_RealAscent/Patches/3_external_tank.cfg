//Gives the external tank a quarter of the real tank's dry mass, and a quarter of the real propellant plus 5.6% for the longer SRB burn.
@PART[oranges_ET_STS]:NEEDS[ORANGES]:BEFORE[ORANGES]
{
	@RESOURCE[LqdHydrogen]
	{
		@amount = 480600
		@maxAmount = 480600
	}
	@RESOURCE[Oxidizer]
	{
		@amount = 32040
		@maxAmount = 32040
	}
}
@PART[oranges_ET_STS]:NEEDS[ORANGES]:FINAL
{
	@mass = 7.864
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchMass]]
	{
		@SUBTYPE[Lightweight?Tank]
		{
			@addedMass = -1.25
		}
		@SUBTYPE[Super?Lightweight?Tank]
		{
			@addedMass = -2.125
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#switcherDescription[SRB?Upper?Support]]
	{
		@SUBTYPE[Off]
		{
			@addedMass = -0.09075
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaint]]
	{
		@SUBTYPE[STS?1]
		{
			@addedMass = 0.068
		}
		@SUBTYPE[White?SOFI]
		{
			@addedMass = 0.068
		}
	}
}
