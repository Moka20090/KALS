//Adds a filament-wound case (FWC) option to the quarter-scale RSRM, the lighter graphite-epoxy case built for the Shuttle's polar launches from Vandenberg SLC-6. The real FWC replaced 31 m of the steel cylinder with about 15 t of graphite-epoxy laminate per motor and kept the steel forward dome and skirt, the external tank attach segment and the aft dome (NASA TP-2117, 1983). Its saving per booster is estimated at 13 t (the steel replaced and the 18 % payload gain give 13 to 19 t), a quarter of it here: 3.25 t. Thrust, propellant and Isp unchanged.
@PART[PC_4Seg_RSRM]:NEEDS[PhotonCorp,B9PartSwitch,KALS_RealAscent]:FINAL
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = caseSwitch
		switcherDescription = Motor case
		switcherDescriptionPlural = Motor cases
		affectDragCubes = false
		affectFARVoxels = false
		SUBTYPE
		{
			name = steel
			title = Steel (RSRM)
			defaultSubtypePriority = 1
			descriptionSummary = The flown RSRM's D6AC steel case.
		}
		SUBTYPE
		{
			name = FWC
			title = Filament-wound (FWC)
			addedMass = -3.25
			descriptionSummary = The graphite-epoxy filament-wound case built for the polar launches from Vandenberg SLC-6: composite cylinder segments in place of the steel ones, with the forward dome, the external tank attach segment and the aft dome still steel. 3.25 t lighter.
		}
	}
}
