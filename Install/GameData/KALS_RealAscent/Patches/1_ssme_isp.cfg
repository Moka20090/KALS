//Gives the SSMEs 53% of their Isp, so the stack has the real Shuttle's delta-v scaled to Quarter scale.
@PART[rmm_cotopaxi]:NEEDS[RocketMotorMenagerie]:FINAL
{
	@MODULE[ModuleEngines*]
	{
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 239.56
			key = 1 193.98
			key = 3 13.25
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE[ssme_FOMF]
		{
			@descriptionDetail = <b>Thrust:</b> 423 kN ASL / 522 kN Vac.\n<b>Isp:</b> 194 s ASL / 239.6 s Vac.
		}
		@SUBTYPE[ssme_Block1]
		{
			@descriptionDetail = <b>Thrust:</b> 442 kN ASL / 546 kN Vac.\n<b>Isp:</b> 194 s ASL / 239.6 s Vac.
		}
		@SUBTYPE[ssme_BlockII]
		{
			@descriptionDetail = <b>Thrust:</b> 462 kN ASL / 570 kN Vac.\n<b>Isp:</b> 194 s ASL / 239.6 s Vac.
		}
		@SUBTYPE[ssme_BlockIII]
		{
			@descriptionDetail = <b>Thrust:</b> 506 kN ASL / 626 kN Vac.\n<b>Isp:</b> 193.2 s ASL / 238.8 s Vac.
			@MODULE
			{
				@DATA
				{
					!atmosphereCurve {}
					atmosphereCurve
					{
						key = 0 238.765
						key = 1 193.185
						key = 3 13.25
					}
				}
			}
		}
		@SUBTYPE[RS-53]
		{
			@descriptionDetail = <b>Thrust:</b> 462 kN ASL / 570 kN Vac.\n<b>Isp:</b> 195 s ASL / 240.6 s Vac.
			@MODULE
			{
				@DATA
				{
					!atmosphereCurve {}
					atmosphereCurve
					{
						key = 0 240.62
						key = 1 195.04
						key = 3 13.25
					}
				}
			}
		}
	}
}
