//Scales the SRB separation motors and decouplers with the quarter-scale casing's mass, so the SRBs separate as before.
@PART[PC_Nose]:NEEDS[PhotonCorp]:FINAL
{
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 51.58
	}
	@RESOURCE[SolidFuel]
	{
		@amount = 10.316
		@maxAmount = 10.316
	}
}
@PART[PC_RSRM_RadialDecoupler]:NEEDS[PhotonCorp]:FINAL
{
	@MODULE[ModuleAnchoredDecoupler]
	{
		@ejectionForce = 1719
	}
}
