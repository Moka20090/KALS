//Makes the SRB a quarter-scale RSRM: a quarter of the real casing and propellant mass, a quarter of the real thrust plus 2.4%, two thirds of the Isp for an 80 s burn, and the real RSRM's thrust profile.
@PART[PC_4Seg_RSRM]:NEEDS[PhotonCorp]:FINAL
{
	@mass = 21.425
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 3643.8
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 178.66
			key = 1 161.32
			key = 7 0.00067
		}
	}
	@RESOURCE[SolidFuel]
	{
		@amount = 16667
		@maxAmount = 16667
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[thrustCurveSwitch]]
	{
		@SUBTYPE[default]
		{
			@descriptionSummary = The default thrust curve for this motor is a fall-rise-fall profile. It starts off flat at 100% thrust, drops to 65% thrust with 65% fuel remaining, then rises to 77% thrust until 35% fuel remaining at which point it starts to tail off to near zero by burnout. Burn time: 94s.
		}
		@SUBTYPE[steady66]
		{
			@descriptionSummary = This regressive thrust curve steadily drops from max thrust to 66% of max, drops sharply to 15% near zero right before burnout. A useful profile for use as a booster. Burn time: 70s.
		}
		@SUBTYPE[flat]
		{
			@descriptionSummary = Perfectly flat thrust profile. Can result in excessive TWR but greatly simplifies burn time calculations. Burn time: 60s.
		}
		SUBTYPE
		{
			name = RSRM
			title = RSRM
			defaultSubtypePriority = 1
			descriptionSummary = The real Space Shuttle RSRM's thrust profile for a full load: a peak near 16% of the burn, the max-q bucket near two thirds of the thrust, a recovery and the tail-off. Burn time: 80s.
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					thrustCurve
					{
						key = 0 0.1395 7.1347 7.1347
						key = 0.00652 0.1861 12.3147 12.3147
						key = 0.02266 0.4186 8.7173 8.7173
						key = 0.05775 0.6326 2.1069 2.1069
						key = 0.17721 0.7443 0.6952 0.6952
						key = 0.31201 0.8094 -0.0858 -0.0858
						key = 0.39398 0.7257 -1.2083 -1.2083
						key = 0.466 0.6233 -0.4508 -0.4508
						key = 0.51779 0.6698 1.4043 1.4043
						key = 0.61838 0.8373 1.2127 1.2127
						key = 0.79005 1 0.5165 0.5165
						key = 0.8958 0.9806 -0.1387 -0.1387
						key = 1 0.9709 -0.0932 -0.0932
					}
				}
			}
		}
	}
}
