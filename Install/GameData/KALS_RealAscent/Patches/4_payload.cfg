//Adds a 2.94 t payload that brings the orbiter to the real orbiter's liftoff mass at Quarter scale; decouple it in orbit to deploy it.
+PART[Decoupler_1p5]:NEEDS[Benjee10_shuttleOrbiter]:FINAL
{
	@name = SOCK_RealAscent_payload
	@title = SOCK RealAscent Payload (2.94 t)
	@description = A payload of 2.94 t for the payload bay: with it the orbiter has the real orbiter's liftoff mass at Quarter scale. Attach it by its bottom node, e.g. to a payload bay node; it is not staged: right-click Decouple in orbit to deploy it.
	@category = Payload
	@mass = 2.9425
	@MODULE[ModuleDecouple]
	{
		@explosiveNodeID = bottom
		%stagingEnabled = False
	}
	!MODULE[ModuleCargoPart] {}
	!MODULE[ModuleTestSubject] {}
}
