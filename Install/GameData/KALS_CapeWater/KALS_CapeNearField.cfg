// T480c (ENGINEER 2026-11-03): the Katniss Cape's water to ~80 km, Cape only. Mirage draws Earth's ground from its own
// height tiles past the PQS material's _NearFieldEnd from the camera (Sol ships 1000 m + 500 m blend), which drops the
// KK map decals (KALS_CapeWater) beyond ~1.5 km. The addon KalsCapeNearField in KALS_Coproc's SockCoproc.dll sets
// Earth's _NearFieldEnd / _BlendWidth below while the camera is within onKm of the KK_MapDecal's centre and puts back
// the values it read at load beyond offKm (hysteresis), Flight and Space Center scenes, about once a second.
// This node is its ON switch: delete the file and the addon does nothing. INSTALL.bat's Cape option installs it (stock and FAR: the owner 11-12).
KALS_CAPE_NEARFIELD
{
	body = Earth
	decal = KALS_CapeWater
	onKm = 150
	offKm = 175
	nearFieldEnd = 60000
	blendWidth = 20000
}
