// The KerboArm elbow's full 180 deg fold: KalsCoproc.dll's KalsElbow (coproc/KalsElbow.cs) moves the hinge joint's zero
// from the straight pose to the middle of the travel, so both ends (0 and -180) lie 90 deg from it, inside what Unity's
// joint can hold. The module sits after the part's ModuleRoboticServoHinge and runs right after the hinge's own setup.
@PART[ht_C1_elbow]:HAS[@MODULE[ModuleRoboticServoHinge],!MODULE[KalsElbow]]:NEEDS[KALS_Coproc]
{
	MODULE
	{
		name = KalsElbow
		midAngle = -90   // deg, the hinge angle that becomes the joint's zero
	}
}
