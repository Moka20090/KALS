// KAL/S CAPE SHIFT (T511): moves Katniss's Cape Canaveral 0.03597 deg south and 0.0990 deg west so the Cape sits on Sol's coast (the pad, the City2 mesh, the
// KSC Switcher site, the Kerbal Konstructs group centre and the two terrain decals all move together), as ONE option. It sets the values by ABSOLUTE number, so it
// changes nothing of Katniss's files: they stay exactly as published (a Katniss update, or removing this folder, puts the published Cape back).
// It is installed together with KALS_CapeWater (the water fix + the DLL's near-field switch) by INSTALL.bat's Cape question, never alone and never without it.
//
// WHY THIS FOLDER IS CALLED ZZ_KALS_CapeShift: two of Katniss's own files (Patches/EarthPatch.cfg, Patches/LaunchSitesPatch.cfg) are :FINAL patches that CREATE the City2
// node and the launch site's numbers; this file edits their result, so it must run after them inside the :FINAL pass. ModuleManager applies the patches of one pass
// in the order of the config files, and the folders of GameData are listed alphabetically: ZZ_... comes after KatnisssCapeCanaveral/... (and KALS_... before it).
// If a future ModuleManager changed that order, the three Kopernicus / KSCSwitcher edits would silently do nothing (the Cape would show as published while the
// water decal sits at the shifted spot): the check is KSP.log / ModuleManager.ConfigCache, see the dev tools.
//
// Needs: Katniss's Cape Canaveral, Kopernicus, Kerbal Konstructs, KSCSwitcher.
@KK_GroupCenter:HAS[#Group[CapeCanaveral]]:NEEDS[KatnisssCapeCanaveral]:FINAL
{
	@RefLatitude = 28.487427192
	@RefLongitude = -80.721263457
}

@KK_MapDecal:HAS[#Name[KK_MapDecal_0]]:NEEDS[KatnisssCapeCanaveral]:FINAL
{
	@Latitude = 28.561406790
	@Longitude = -80.704529599
}

@KK_MapDecal:HAS[#Name[KK_MapDecal_1]]:NEEDS[KatnisssCapeCanaveral]:FINAL
{
	@Latitude = 28.182626400
	@Longitude = -80.707641453
}

@Kopernicus:NEEDS[KatnisssCapeCanaveral]:FINAL
{
	@Body[Earth]
	{
		@PQS
		{
			@Mods
			{
				@City2:HAS[#name[KCC_CapeCanaveral]]
				{
					@lat = 28.549797392
					@lon = -80.749848315
				}
			}
		}
		@SpaceCenter
		{
			@latitude = 28.487426492
			@longitude = -80.752263257
		}
	}
}

@KSCSWITCHER:NEEDS[KatnisssCapeCanaveral]:FINAL
{
	@LaunchSites
	{
		@Site[us_cape_canaveral]
		{
			@PQSCity
			{
				@latitude = 28.487426492
				@longitude = -80.752263257
			}
			@PQSMod_MapDecalTangent
			{
				@latitude = 28.487426492
				@longitude = -80.752263257
			}
		}
	}
}
