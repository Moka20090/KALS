// KALS_BayOptional: the starboard side-wall mount of the GAS adapter beam (KALS_GasBeam).
// ADDS only one NODE (kalsGasMountS, a transform of KALS_GasMounts.mu, pointing up like the bay nodes) to SOCK's OV-100 mid fuselage;
// nothing else of the part changes, no craft changes.  Remove this file and the beam has nothing to attach to.
// The mount sits at x 1.045, y -0.25, z 0.075 (mid frame, +Y fwd, +X starboard, -Z up): between the starboard PRLA latch stations
// 0.79 and -1.29, under the doors' swing, clear of the bay models' blankets, cable tray and floodlight (checked offline).
@PART[benjee10_shuttle_midFuselage]:NEEDS[Benjee10_shuttleOrbiter]:AFTER[Benjee10_shuttleOrbiter]
{
	MODEL { model = KALS_BayModels/Models/KALS_GasMounts }

	NODE
	{
		name = kalsGasMountS
		transform = kalsGasMountS
		size = 0
	}
}
