// A B9 PartSwitch variant without the yoke box:
// the Keel Cargo Carrier gets a B9 PartSwitch choice in the editor's right-click menu:
//   High (default)      = the part as it was: the keel yoke box + trunnion under the spine, deck nodes 0.68 m up;
//   Low                 = the yoke box, its trunnion and its collider hidden, the spine / deck / frames / rails / pads / bolts
//                         and the deck collider lowered 0.31 m onto the floor node, the deck node with them (0.37 m up).
// Part frame: -Z is up (the floor node points +Z, into the floor), so +0.31 in Z lowers. Every moved transform is a direct
// child of the model root at zero local offset, so the
// offsets are exact. Craft built before this patch keep the default (yoke) subtype. Mass unchanged (the yoke is light).
@PART[KALS_KeelCarrier]:NEEDS[B9PartSwitch]:FOR[KALS_BayModels]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = kalsKeelMount
		switcherDescription = Keel mount
		SUBTYPE
		{
			name = Yoke
			title = High
			transform = keelYoke
			transform = keelTrunnion
			transform = yokeCollider
		}
		SUBTYPE
		{
			name = Low
			title = Low
			TRANSFORM
			{
				name = spine
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = deck
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = deckRails
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = crossFrames
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = struts
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = deckPads
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = railBolts
				positionOffset = 0, 0, 0.31
			}
			TRANSFORM
			{
				name = deckCollider
				positionOffset = 0, 0, 0.31
			}
			NODE
			{
				name = deck
				position = 0, 0, -0.37
			}
		}
	}
}
