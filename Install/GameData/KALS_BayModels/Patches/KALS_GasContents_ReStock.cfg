// The GAS canisters were empty: ReStock REMOVES the stock science models at load (KSP.log: "[Restock] Removing
// Squad/Parts/Science/Magnetometer|GooExperiment|ScienceBox/..."), so the MODEL nodes of KALS_GasCanister.cfg (those stock models standing
// inside the open can) pointed at files that no longer exist and nothing was drawn. With ReStock installed the can shows ReStock's own models
// instead (the goo canister three times, one standing where the Magnetometer was because its mu has animated children our fit tool cannot walk,
// and the science box);
// without ReStock the part cfg's stock nodes stand untouched. Positions / scales fitted offline (the can's
// frame: base plane origin, -Z up, floor -0.182, inner wall radius 0.160), checked in its render.
// KSP's MODEL node REPLACES the mu root's own local position / rotation / scale, but the first fit
// kept them (ReStock's science box mu has its root at z -0.784, the goo canister's at x +0.2158), so the box stood 0.118 m too far along +Y,
// outside the can wall, and the goo canisters 0.04-0.05 m off. Refitted with the root dropped.
// The nodes are edited BY INDEX among the part's MODEL nodes: 0 the can, 1 Magnetometer, 2 GooExperiment, 3 GooExperiment (lying), 4 ScienceBox
// (the order of KALS_GasCanister.cfg); node 1 becomes a goo canister (no node is deleted).
// Packing:
// the can is PACKED with RADIAL parts (ReStock goo canisters, science boxes, radial batteries, thermometer / barometer / accelerometer / gravimeter), each hung by
// its own bracket's back face on the can's inner wall, in rings from the shelf up to under the lid ring, nothing intersecting (visual MODEL nodes only: no
// modules, no mass).  Nodes 1-4 are edited by index as before (the first four packed items); every other item is a MODEL node APPENDED after them.
// Positions / scales / rotations: fitted offline.
@PART[KALS_GasCanister]:NEEDS[ReStock]:AFTER[ReStock]
