// KALS_BayModels: our own payload bay models, made by script.
// The patch ADDS the models to SOCK's OV-100 mid fuselage, so every orbiter built on it sees them (no craft edits):
//   sills + bolt rows / seal inlays, the MPM shoulder pedestal and MRL cradles on the port sill (a starboard set for a boom),
//   the PRLA rails + latches on the sills and the keel, gold handrails, white quilted blankets on the side walls, six
//   functional floodlights (Unity spot lights in the model, run by ModuleLight: the Lights action group) + four CCTV
//   cameras at the bulkhead corners, wire trays + cable bundles, forward / aft bulkhead detail, bridge fittings,
//   EVA slidewires + foot restraint sockets, the PSA tool stowage box.
// Frame of the models = the part's own (+Y forward, +X starboard, -Z up); every model sits inside the bay under the doors'
// swing (checked offline against the doors' animation at 13 poses).
// The shoulder NODE 'kalsArmShoulder' is the attach point of the Canadarm roll servo (body y 3.25, x -1.19, z +0.056: the pedestal pad);
// the NODE 'kalsKuBand' is the Ku-band antenna's.
@PART[benjee10_shuttle_midFuselage]:NEEDS[Benjee10_shuttleOrbiter]:AFTER[Benjee10_shuttleOrbiter]
{
	MODEL { model = KALS_BayModels/Models/KALS_BaySills }
	MODEL { model = KALS_BayModels/Models/KALS_BayPedestals }
	MODEL { model = KALS_BayModels/Models/KALS_BayLatches }
	MODEL { model = KALS_BayModels/Models/KALS_BayHandrails }
	MODEL { model = KALS_BayModels/Models/KALS_BayBlankets }
	MODEL { model = KALS_BayModels/Models/KALS_BayLights }
	MODEL { model = KALS_BayModels/Models/KALS_BayCables }
	MODEL { model = KALS_BayModels/Models/KALS_BayBulkheads }
	MODEL { model = KALS_BayModels/Models/KALS_BayBridges }
	MODEL { model = KALS_BayModels/Models/KALS_BayEvaAids }
	MODEL { model = KALS_BayModels/Models/KALS_BayPsaBox }

	NODE
	{
		name = kalsArmShoulder
		transform = kalsArmShoulderNode
		size = 1
	}

	// the Ku-band antenna's attach node, on the starboard sill just aft of the ODS truss
	NODE
	{
		name = kalsKuBand
		transform = kalsKuNode
		size = 0
	}

	// the three starboard MPM pedestals' attach nodes (the pedestal part was removed; the nodes stay, size 0, for the revisit)
	NODE
	{
		name = kalsPedNode1S
		transform = kalsPedNode1S
		size = 0
	}

	NODE
	{
		name = kalsPedNode2S
		transform = kalsPedNode2S
		size = 0
	}

	NODE
	{
		name = kalsPedNode3S
		transform = kalsPedNode3S
		size = 0
	}

	// the six floodlights (all the model's Lights named kalsFloodlight; the lens meshes kalsFloodLens glow with them)
	MODULE
	{
		name = ModuleLight
		lightName = kalsFloodlight
		lightMeshRendererName = kalsFloodLens
		useAnimationDim = false
		lightBrightenSpeed = 2.5
		lightDimSpeed = 2.5
		resourceAmount = 0.24
		useResources = true
		canBlink = false
		isOn = false
		disableColorPicker = true
		lightR = 1.0
		lightG = 0.96
		lightB = 0.88
	}
}
