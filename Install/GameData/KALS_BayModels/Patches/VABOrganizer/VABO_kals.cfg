// A VAB Organizer
// subcategory for every KAL/S part. Each patch is :NEEDS[VABOrganizer], so the game runs the same without that mod.
// (KALS_MpmPedestal has no part.) Picks: GasBeam -> adapters, GasCanister -> science,
// KeelCarrier -> cargoContainers, MpmRoll -> hinges (the subcategory names are VABOrganizer's own, Subcategories/*.cfg).
@PART[KALS_GasBeam]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = adapters
	}
}

@PART[KALS_GasCanister]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = science
	}
}

@PART[KALS_KeelCarrier]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = cargoContainers
	}
}

@PART[KALS_MpmRoll]:NEEDS[VABOrganizer]
{
	%VABORGANIZER
	{
		%organizerSubcategory = hinges
	}
}
