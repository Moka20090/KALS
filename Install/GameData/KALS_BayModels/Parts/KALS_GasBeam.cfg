// A GAS adapter beam for the starboard side wall (the real SSBUV cans rode on one on Atlantis' starboard wall, STS-43): a
// 2.3 m I-beam, three can stations, end posts with trunnion pins towards the PRLA latches at stations 0.79 and -1.29.
// Attaches to the mid fuselage's node kalsGasMountS (patch KALS_BayOptional.cfg); origin = that node, the beam points up.
PART
{
	name = KALS_GasBeam
	module = Part
	author = KAL/S (ENGINEER, T603)
	rescaleFactor = 1.02
	TechRequired = start
	entryCost = 0
	subcategory = 0
	attachRules = 1,0,1,0,0
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 1
	crashTolerance = 8
	maxTemp = 1200
	skinMaxTemp = 1700
	bulkheadProfiles = size0
	MODEL { model = KALS_BayModels/Models/KALS_GasBeam }
	node_stack_mount = 0, 0, 0, 0, 0, 1, 0
	node_stack_can1 = 0, -0.620, -0.075, 0, 0, -1, 0
	node_stack_can2 = 0, 0.000, -0.075, 0, 0, -1, 0
	node_stack_can3 = 0, 0.620, -0.075, 0, 0, -1, 0
	category = Structural
	cost = 900
	mass = 0.03
	title = KAL/S GAS Adapter Beam
	manufacturer = KAL/S Orbiter Payloads
	description = A side-wall adapter beam for Get Away Special canisters. It mounts on the starboard sill of the OV-100 payload bay and carries up to three canisters, standing upright under the closed doors.
	tags = gas get away special adapter beam sidewall shuttle payload bay structural
}
