// The MPM roll servo of the Canadarm's shoulder, with the three retention-cradle fittings that roll with the arm.
// A hinge servo cloned from htRobotics' htC1pitch.cfg (ModuleRoboticServoHinge: same transform names, the same nodes at the same
// places, the same drive numbers, so the arm's joint chain and kOS scripts see exactly the servo they saw before).  The moving half
// (the model's `servo` transform) carries the shoulder fitting and the three cradle fittings; the base half stays on the pedestal pad.
// Origin = the hinge centre (the stock servo's too), hinge axis = the part's local Z, stack axis = local Y.
PART
{
	name = KALS_MpmRoll
	module = Part
	author = KAL/S (ENGINEER 2, T775)

	rescaleFactor = 1
	TechRequired = advConstruction
	entryCost = 1000
	cost = 120
	category = Robotics
	subcategory = 0
	title = KAL/S MPM Roll Servo
	manufacturer = KAL/S Orbiter Mechanisms
	description = The Manipulator Positioning Mechanism's roll joint at the shoulder of the orbiter's arm: a hinge servo whose moving half carries the shoulder fitting and the three retention fittings, so they roll out with the arm and back for stowage.

	attachRules = 1,0,1,0,0
	mass = 0.036
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 12
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2000
	bulkheadProfiles = size1
	tags = kals, mpm, shoulder, roll, hinge, servo, canadarm, rms

	MODEL
	{
		model = KALS_BayModels/Models/KALS_MpmRoll
	}

	NODE
	{
		name = TopJoint
		transform = pitchJoint_topNode
		size = 1
	}
	NODE
	{
		name = BottomJoint
		transform = pitchJoint_bottomNode
		size = 1
	}

	// Travel 0..30 deg outboard; a new placement starts at 12 (STOW, the largest roll that clears the closed bay doors).
	MODULE
	{
		name = ModuleRoboticServoHinge
		servoTransformName = servo
		baseTransformName = base
		servoAttachNodes = TopJoint
		traverseVelocityLimits = 0, 10
		hardMinMaxLimits = 0, 30
		softMinMaxAngles = 0, 30
		targetAngle = 12
		maxMotorOutput = 50
		driveSpringMutliplier = 100
		driveDampingMutliplier = 20
		motorizedMassPerKN = 0.0002
		motorizedCostPerDriveUnit = 1
		connectedMassScale = 1
		efficiency = 0.75
		baseResourceConsumptionRate = 0.01
		RESOURCE
		{
			name = ElectricCharge
			rate = 1
		}
		mainAxis = Z
	}

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 10
	}
}
