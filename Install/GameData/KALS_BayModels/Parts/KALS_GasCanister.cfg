// A Get Away Special canister: the 5 cubic foot can (0.5 m x 0.72 m real, drawn at the bay's 0.67 cross-section scale), aluminium
// body, motor-driven lid.  "Deploy" opens the lid (animation KALS_GasLid), then the experiment can be run (in space only: a GAS can is
// closed to the atmosphere for launch and descent).  Mounts on a KALS_GasBeam can node (origin = the base interface, node points to the beam).
PART
{
	name = KALS_GasCanister
	module = Part
	author = KAL/S (ENGINEER, T603)
	rescaleFactor = 1.02
	TechRequired = start
	entryCost = 0
	subcategory = 0
	attachRules = 1,0,1,0,0
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 1
	crashTolerance = 8
	maxTemp = 1200
	skinMaxTemp = 1700
	bulkheadProfiles = size0
	MODEL { model = KALS_BayModels/Models/KALS_GasCanister }
	// Stock science models inside the open can (looks only: no modules, no mass, no colliders of ours; the lid hides them closed).
	// Y-up stock models stood up the can's axis (-Z) by rotation -90 0 0.
	// KSP's MODEL node REPLACES the mu root's own local position / rotation / scale (the stock ScienceBox's root sits 20 m from its mesh),
	// so the fit drops the root (kept, the box stood 2.4 m outside the can).
	MODEL
	{
		model = Squad/Parts/Science/Magnetometer/Magnetometer
		position = -0.0000, -0.0500, -0.1908
		scale = 0.2910, 0.2910, 0.2910
		rotation = -90.000, 0.000, 0.000
	}
	MODEL
	{
		model = Squad/Parts/Science/GooExperiment/GooExperiment
		position = 0.1570, -0.0007, -0.3074
		scale = 0.2194, 0.2194, 0.2194
		rotation = -0.000, 90.000, -90.000
	}
	MODEL
	{
		model = Squad/Parts/Science/GooExperiment/GooExperiment
		position = -0.1570, 0.0007, -0.3074
		scale = 0.2194, 0.2194, 0.2194
		rotation = -0.000, -90.000, 90.000
	}
	MODEL
	{
		model = Squad/Parts/Science/ScienceBox/ScienceBox
		position = 0.0000, 0.1111, -0.2480
		scale = 0.1700, 0.1700, 0.1700
		rotation = -90.000, -0.000, 0.000
	}
	// Each content is a RADIAL part (goo canister / science box)
	// hung by its own bracket's back face on the can's inner wall, upright, its lowest point on the shelf (this is the no-ReStock fallback: with ReStock the patch
	// KALS_GasContents_ReStock.cfg PACKS the can).
	node_stack_base = 0, 0, 0, 0, 0, 1, 0
	category = Science
	cost = 3200
	mass = 0.045
	title = KAL/S Get Away Special Canister
	manufacturer = KAL/S Orbiter Payloads
	description = A self-contained experiment canister of the Get Away Special program: an aluminium can with a motor-driven lid. It rides on an adapter beam on the payload bay's side wall. Open the lid in orbit to expose its experiments to space, run the experiment, and bring the data home or transmit it.
	tags = gas get away special canister experiment science microgravity shuttle payload bay
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = KALS_GasLid
		startEventGUIName = Open Lid
		endEventGUIName = Close Lid
		actionGUIName = Toggle Lid
		evaDistance = 2
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = kalsGasCanister
		experimentActionName = Run GAS Experiment
		resetActionName = Reset GAS Experiment
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		xmitDataScalar = 0.6
		FxModules = 0
		dataIsCollectable = True
		collectActionName = Collect Data
		interactionRange = 2
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
}
