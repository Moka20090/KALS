		default = The cosmic-ray counter clicks happily. Somewhere on the ground, a professor who has waited eleven years for this slot finally exhales.
		default = One experiment was supposed to grow crystals. It grew one crystal, shaped exactly like the canister's mounting bolt. This is either a breakthrough or a cleaning problem.
