// The science definition of the GAS canister (KALS_GasCanister's ModuleScienceExperiment, experimentID kalsGasCanister): in space only
// (InSpaceLow 16 + InSpaceHigh 32 = 48), no biome split, worth more than a goo canister because it flies in the bay all the way up.
// Why the message families below: only the low-orbit science message showed.
// KSP's rule (ResearchAndDevelopment.GetResults, read from its IL): a key that EQUALS the situation
// string (EarthInSpaceLow) always gives its first line, so its other lines never show. A key that is only a
// SUBSTRING of the situation (EarthInSpaceLo) is one of the keys a situation picks from at random. Each family
// below = its own lines + the 10 default lines. KSP renames repeated keys (EarthInSpaceLo*, EarthInSpaceLo**).
// The plain default lines serve the other situations (no family matches): only their first line can show there.
EXPERIMENT_DEFINITION
{
	id = kalsGasCanister
	title = GAS Canister Experiment
	baseValue = 12
	scienceCap = 24
	dataScale = 1.5
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 0

